<!doctype html><meta charset=utf-8><title>Jack — Laufsicht</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<style>
:root{--bg:#12131a;--fl:#1b1d27;--li:#2a2d3d;--tx:#e8e9f0;--dim:#8b8fa3;
--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--akz:#818cf8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;padding:24px}
h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 6px;font-weight:600}
.unter{color:var(--dim);font-size:12px;margin-bottom:18px}
.pille{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;letter-spacing:.08em;
text-transform:uppercase;margin-right:8px;border:1px solid var(--li)}
.pille.ok{color:var(--ok);border-color:#1f5c38}.pille.warn{color:var(--warn);border-color:#5a4a1c}
.pille.bad{color:var(--bad);border-color:#6b2a2a}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.z{background:var(--fl);border:1px solid var(--li);border-radius:8px;padding:14px 16px}
.z b{display:block;font-size:27px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.z s{display:block;text-decoration:none;font-size:11px;color:var(--dim);text-transform:uppercase;
letter-spacing:.09em;margin-top:5px}
.ok b{color:var(--ok)}.warn b{color:var(--warn)}.bad b{color:var(--bad)}
.bal{height:7px;background:var(--li);border-radius:4px;overflow:hidden;margin-top:9px}
.bal i{display:block;height:100%;background:var(--akz);transition:width .4s}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:26px 0 10px;font-weight:600}
.band{position:relative;height:22px;background:var(--fl);border:1px solid var(--li);border-radius:6px;overflow:hidden}
.band i{position:absolute;top:0;bottom:0;background:#2f3a6b}
.band u{position:absolute;top:0;bottom:0;width:2px;background:var(--ok)}
.band em{position:absolute;top:0;bottom:0;width:3px;background:var(--warn)}
.skala{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;margin-top:4px}
.denkraum{background:var(--fl);border:1px solid var(--li);border-left:3px solid var(--ok);border-radius:8px;
margin-bottom:12px;padding:14px 18px;display:flex;gap:14px;max-height:280px;overflow:auto}
.denkraum i{font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ok);
min-width:70px;flex:none;padding-top:2px}
.denkraum span{white-space:pre-wrap;min-width:0;color:var(--tx);line-height:1.65}
.denkraum.schreibt{border-left-color:var(--akz)}.denkraum.schreibt i{color:var(--akz)}
.cur{color:var(--ok);font-weight:400;animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.spur{background:var(--fl);border:1px solid var(--li);border-radius:8px;margin-bottom:20px}
.spur>div{padding:7px 14px;border-top:1px solid rgba(255,255,255,.05);display:flex;gap:12px}
.spur>div:first-child{border-top:none}
.spur i{font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
min-width:80px;flex:none;padding-top:2px}
.spur span{white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.spur small{color:var(--dim);flex:none;margin-left:auto;padding-left:10px}
.spur .denkt span{color:var(--dim)}.spur .ruft span{color:var(--akz)}
.spur .fehler span{color:var(--bad)}.spur .sperre span,.spur .kompaktiert span{color:var(--warn)}
.spur .ende span{color:var(--ok)}
pre{background:var(--fl);border:1px solid var(--li);border-radius:8px;padding:14px;white-space:pre-wrap;
color:var(--dim);font-size:12.5px;margin:0 0 20px;max-height:360px;overflow:auto}
ul.offen{background:#2b2416;border:1px solid #5a4a1c;border-radius:8px;padding:10px 14px 10px 32px;
margin:0 0 20px;color:var(--warn)}
ul.offen.leer{background:#16271d;border-color:#1f5c38;color:var(--ok);list-style:none;padding-left:14px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--fl);border:1px solid var(--li);border-radius:8px;
overflow:hidden;margin-bottom:20px;font-size:12px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding:8px 10px;
background:#20222c;font-weight:600;position:sticky;top:0}
td{padding:7px 10px;border-top:1px solid var(--li);vertical-align:top;font-variant-numeric:tabular-nums}
tr:hover td{background:#1f212b}
.nr{color:var(--dim);white-space:nowrap}
.beleg{color:var(--dim);font-style:italic;max-width:34ch}
.meta{display:block;color:var(--dim);font-size:10px;text-decoration:none;margin-top:2px}
tr.frisch td{box-shadow:inset 3px 0 0 var(--ok)}tr.frisch td:first-child{color:var(--ok);font-weight:600}
tr.weg td{color:var(--dim);text-decoration:line-through;background:#171820}
tr.weg td .grund{display:block;text-decoration:none;color:var(--warn);font-size:10px;margin-top:2px}
.alt{background:#2b2416;border:1px solid #5a4a1c;color:var(--warn);border-radius:8px;padding:9px 14px;
margin-bottom:16px;font-size:12.5px}
footer{color:var(--dim);font-size:12px;border-top:1px solid var(--li);padding-top:14px;margin-top:10px}
</style>
<h1 id=titel>Jack — Laufsicht</h1>
<div class=unter id=unter>verbindet…</div>
<div id=warn></div>
<div id=kacheln></div>
<div id=denken></div>
<div id=rest></div>
<footer>Live über Server-Sent Events · Denken und Text Token für Token · <span id=verbindung>–</span></footer>
<script>
const E=s=>String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const PHASE={1:'Phase 1: lesen, Gedächtnis anlegen',2:'Phase 2: Aussagen sammeln',3:'Phase 3: Bestand ordnen'};
let Z={stand:null,lauf:null,spur:[],denkt:'',schreibt:''};
let faellig=false;

function sek(t){ if(!t) return null; return Math.max(0,Math.round((Date.now()-Date.parse(t))/1000)); }
function dauer(s){ if(s==null) return '–'; if(s<60) return s+' s'; const m=Math.floor(s/60);
  return m<60 ? m+' min '+(s%60)+' s' : Math.floor(m/60)+' h '+(m%60)+' min'; }
function neu(){ if(!faellig){ faellig=true; requestAnimationFrame(()=>{ faellig=false; zeichnen(); }); } }
function kachel(wert,name,kl,extra){ return `<div class="z ${kl||''}"><b>${wert}</b><s>${name}</s>${extra||''}</div>`; }

function status(){
  const l=Z.lauf||{};
  if(!l.start) return ['wartet auf den Lauf','warn'];
  if(l.ende) return ['beendet: '+l.ende, /fertig|halt/.test(l.ende)?'ok':'bad'];
  if(l.wartet_seit) return ['wartet auf das Modell · '+dauer(sek(l.wartet_seit)),'ok'];
  return ['läuft','ok'];
}

// Anteil der Blöcke, die in diesem Durchgang gelesen wurden (Vereinigung der Bereiche).
function abdeckung(s){
  if(s.max_block==null||s.max_block<0) return null;
  const iv=(s.gelesen||[]).map(([v,b])=>[Math.min(v,b),Math.max(v,b)]).sort((a,b)=>a[0]-b[0]);
  let bis=-1, zahl=0;
  for(const [v,b] of iv){ const a=Math.max(v,bis+1); if(b>=a) zahl+=b-a+1; bis=Math.max(bis,b); }
  return Math.round(zahl/(s.max_block+1)*100);
}

function zeichnen(){
  const s=Z.stand||{}, l=Z.lauf||{};
  document.getElementById('titel').textContent='Jack — '+(PHASE[s.phase]||'Laufsicht')+(s.phase===3?' ('+s.rolle+')':'');
  const [st,kl]=status();
  const still=sek(l.letztes);
  document.getElementById('unter').innerHTML=
    `<span class="pille ${kl}">${E(st)}</span>`+
    `Durchgang ${E(s.durchgang??'–')} · Modell ${E(l.modell||'–')}`+
    (l.start?` · läuft seit ${dauer(sek(l.start))}`:'')+
    (still!=null&&!l.ende?` · letztes Ereignis vor ${dauer(still)}`:'');
  document.getElementById('warn').innerHTML=(!l.ende&&still!=null&&still>600)
    ? `<div class=alt>Seit ${dauer(still)} kein Ereignis — der Lauf hängt, oder das Modell rechnet sehr lange.</div>` : '';

  const w=l.werkzeuge||{}, kp=l.kontext_prozent, gel=abdeckung(s), j=s.journal||{};
  const klk=kp==null?'':kp>85?'bad':kp>65?'warn':'ok';
  const neuHier=(l.bestand_start!=null&&s.bestand!=null)?s.bestand-l.bestand_start:null;
  let h=`<div class=k>`+
    kachel(s.bestand??0,'Aussagen im Bestand')+
    (s.phase===2&&neuHier!=null?kachel(neuHier,'neu in diesem Lauf',neuHier>0?'ok':''):'')+
    kachel(s.abgelehnt??0,'Ablehnungen',s.abgelehnt>0?'warn':'')+
    kachel(j['dubletten.jsonl']||0,'Vorlagen aus dem Bestand')+
    (s.geraten>0?kachel(s.geraten,'erfundene GUIDs','bad'):'')+
    kachel(gel==null?'–':gel+'%','Mitschnitt gelesen','',gel==null?'':`<div class=bal><i style="width:${gel}%"></i></div>`)+
    kachel(l.runden||0,'Modellrunden')+
    kachel(kp==null?'–':kp+'%',`Kontext (${l.kontext_jetzt||0}${l.kontext_fenster?' / '+l.kontext_fenster:''})`,klk,
      kp==null?'':`<div class=bal><i style="width:${Math.min(kp,100)}%"></i></div>`)+
    kachel(l.am_deckel||0,'am Ausgabedeckel',l.am_deckel>0?'bad':'')+
    kachel(l.wiederholungen||0,'Wiederholungssperre',l.wiederholungen>0?'warn':'')+
    kachel(l.kompaktierungen||0,'Kompaktierungen')+
    kachel(l.fehler||0,'Werkzeugfehler',l.fehler>0?'warn':'')+
    `</div>`;
  const reihe=(l.werkzeug_liste&&l.werkzeug_liste.length)?l.werkzeug_liste:Object.keys(w);
  if(reihe.length) h+=`<div class=k>`+reihe.map(n=>kachel(w[n]||0,n+'()')).join('')+`</div>`;
  document.getElementById('kacheln').innerHTML=h;

  let r=band(s);
  if(Z.spur&&Z.spur.length){
    r+=`<h2>Was gerade passiert</h2><div class=spur>`+Z.spur.slice().reverse().map(v=>
      `<div class="${E(v.was)}"><i>${E(v.was)}</i><span>${E(v.text)}</span><small>${E((v.t||'').slice(11,19))}</small></div>`
    ).join('')+`</div>`;
  }
  const hi=s.hindernisse||[];
  r+=`<h2>Was fertig() gerade ablehnen würde</h2>`+(hi.length
    ? `<ul class=offen>${hi.map(x=>`<li>${E(x)}</li>`).join('')}</ul>`
    : `<ul class="offen leer"><li>nichts — der Abschluss ginge durch</li></ul>`);
  if(l.letzte&&l.letzte.length){
    r+=`<h2>Letzte Modellrunden</h2><div class=wrap><table><tr><th>Zeit</th><th>Runde</th><th>Dauer</th>`+
      `<th>Eingabe</th><th>Ausgabe</th><th>Ende</th><th>Aufrufe</th></tr>`+
      l.letzte.slice().reverse().map(x=>`<tr><td class=nr>${E((x.t||'').slice(11,19))}</td><td>${E(x.runde)}</td>`+
        `<td>${x.ms!=null?(x.ms/1000).toFixed(1)+' s':'–'}</td><td>${E(x.eingabe??'–')}</td><td>${E(x.ausgabe??'–')}</td>`+
        `<td style="color:${x.stopp==='laenge'?'var(--bad)':'inherit'}">${E(x.stopp)}</td>`+
        `<td>${E((x.aufrufe||[]).join(', '))}</td></tr>`).join('')+`</table></div>`;
  }
  if(s.notizen) r+=`<h2>Gedächtnis (${(s.register||[]).length} Einträge)</h2><pre>${E(s.notizen)}</pre>`;
  r+=aussagen(s,l);
  document.getElementById('rest').innerHTML=r;
}

// Der Mitschnitt als Band: blau gelesen, grün belegt, gelb die nächste Portion.
function band(s){
  if(s.max_block==null||s.max_block<0) return '';
  const n=s.max_block+1, p=x=>(x/n*100).toFixed(3)+'%';
  let h=`<h2>Mitschnitt: gelesen und belegt</h2><div class=band>`;
  for(const [v,b] of (s.gelesen||[])){ const a=Math.min(v,b), e=Math.max(v,b); h+=`<i style="left:${p(a)};width:${p(e-a+1)}"></i>`; }
  const belegt=new Set();
  for(const a of (s.aussagen||[])) if(!a._verworfen) for(const x of (a.source_refs||[])) belegt.add(x);
  for(const x of belegt) h+=`<u style="left:${p(x)}"></u>`;
  if(s.beppo&&s.beppo_pos<=s.max_block) h+=`<em style="left:${p(s.beppo_pos)}"></em>`;
  return h+`</div><div class=skala><span>0</span><span>blau: gelesen · grün: belegt`+
    `${s.beppo?' · gelb: nächste Portion':''}</span><span>${E(s.max_block)}</span></div>`;
}

function aussagen(s,l){
  const liste=(s.aussagen||[]).slice().sort((a,b)=>((a._pos??1e9)-(b._pos??1e9))||((a.nummer||0)-(b.nummer||0)));
  if(!liste.length) return '';
  const koll=s.kollisionen||{}, weg=liste.filter(a=>a._verworfen).length;
  let h=`<h2>Aussagen (${liste.length-weg}${weg?' · '+weg+' verworfen':''}) — nach Stelle im Mitschnitt, späteste zuerst</h2>`+
    `<div class=wrap><table><tr><th>Block</th><th>Aussage</th><th>Quellen</th><th>Beleg</th><th>Lauf</th><th>Koll.</th></tr>`;
  for(const a of liste.reverse()){
    const frisch=l.bestand_start!=null&&a.nummer>l.bestand_start&&!a._verworfen;
    h+=`<tr class="${a._verworfen?'weg':''}${frisch?' frisch':''}">`+
      `<td class=nr>${a._pos>=0?E(a._pos):'–'}<s class=meta>#${E(a.nummer)}${a._ersetzt?' ↻':''}</s></td>`+
      `<td>${E(a.claim)}<s class=meta>${E(a.fact_type||'')}${a.character?' · '+E(a.character):''}`+
      `${(a.threads||[]).length?' · '+E(a.threads.join(', ')):''}</s>`+
      `${a._verworfen?`<span class=grund>${E(a._grund||'verworfen')}</span>`:''}</td>`+
      `<td class=nr>${E((a.source_refs||[]).join(', '))}</td><td class=beleg>${E(a.beleg)}</td>`+
      `<td class=nr>L${E(a._iter0??'?')}${a._iter&&a._iter!==a._iter0?`<s class=meta>↻ L${E(a._iter)}</s>`:''}</td>`+
      `<td class=nr>${koll[a.nummer]?'×'+E(koll[a.nummer]):''}</td></tr>`;
  }
  return h+`</table></div>`;
}

// Der Gedanke, der gerade entsteht: eigenes Element, eigener Takt — der
// übrige Aufbau würde ihn sonst bei jedem Neuzeichnen überschreiben.
function denkraum(){
  const d=(Z.denkt||'').slice(-3000), t=(Z.schreibt||'').slice(-2000);
  let h='';
  if(d) h+=`<div class=denkraum id=dr><i>denkt…</i><span>${E(d)}${t?'':'<b class=cur>▌</b>'}</span></div>`;
  if(t) h+=`<div class="denkraum schreibt" id=sr><i>schreibt…</i><span>${E(t)}<b class=cur>▌</b></span></div>`;
  document.getElementById('denken').innerHTML=h;
  for(const id of ['dr','sr']){ const x=document.getElementById(id); if(x) x.scrollTop=x.scrollHeight; }
}

async function laden(){
  try{
    const d=await (await fetch('/zustand')).json();
    Z.stand=d.stand; Z.lauf=d.lauf; Z.spur=d.spur||[]; Z.denkt=d.denkt||''; Z.schreibt=d.schreibt||'';
  }catch(e){}
  zeichnen(); denkraum();
}

function verbinden(){
  const q=new EventSource('/strom');
  // Nach jedem (Wieder-)Verbinden den ganzen Zustand holen: was während der
  // Unterbrechung geschah, kommt über den Strom nicht nach.
  q.onopen=()=>{ document.getElementById('verbindung').textContent='verbunden'; laden(); };
  q.onerror=()=>{ document.getElementById('verbindung').textContent='Verbindung unterbrochen — verbindet neu…'; };
  q.onmessage=m=>{
    let d; try{ d=JSON.parse(m.data); }catch(e){ return; }
    if(d.art==='delta'){ if(d.was==='denken') Z.denkt+=d.text; else Z.schreibt+=d.text; denkraum(); return; }
    if(d.art==='stand'){ Z.stand=d.stand; neu(); return; }
    if(d.art==='lauf'){
      Z.lauf=d.lauf; Z.spur=d.spur||Z.spur;
      if(d.neue_runde){ Z.denkt=''; Z.schreibt=''; denkraum(); }
      neu();
    }
  };
}
laden(); verbinden();
setInterval(()=>{ if(Z.lauf&&!Z.lauf.ende) neu(); },1000);
</script>
